name: Security audit

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm ci

      # The blocking gate. Same script and same allowlist as ci:local, so a
      # scheduled run and a push run can never disagree on what is acceptable.
      - name: Production audit gate
        run: node scripts/ci/check-production-audit.mjs

      # Informational only: dev-dependency advisories are not release blockers,
      # but the weekly run is where we want to notice them accumulating.
      - name: Dev advisories (report only)
        if: always()
        run: npm audit --audit-level=moderate || true
